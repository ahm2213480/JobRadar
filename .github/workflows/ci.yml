name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server — typecheck · lint · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef0123456789
      # sslmode=disable: the service container speaks plain Postgres (no TLS).
      # config/prisma.ts preserves an explicit sslmode, it only adds a default.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobradar_test?schema=public&sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Prisma migrations
        run: npm run db:deploy -w server
      - name: Typecheck
        run: npm run typecheck -w server
      - name: Lint
        run: npm run lint -w server
      - name: Unit + integration tests
        run: npm test -w server

  client:
    name: Client — typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -w client
      - name: Lint
        run: npm run lint -w client
      - name: Production build
        run: npm run build -w client
